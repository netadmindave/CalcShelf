<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#E4E8ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191D" media="(prefers-color-scheme: dark)">
<title>CalcShelf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/mathlive/mathlive-static.css">
<link rel="stylesheet" href="vendor/mathlive/mathlive-fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <!-- Nspire-style document bar: page tabs, document name, mode -->
  <header class="docbar">
    <button class="ib" id="btn-doc" aria-label="Menu and settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="ib" id="btn-addpage" aria-label="Add a tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="docinfo"><span class="mode" id="modebadge">RAD</span></div>
  </header>

  <main class="pages" id="pages"></main>

  <!-- action strip -->
  <div class="strip" id="strip">
    <button class="sk" data-a="esc">esc</button>
    <button class="sk" data-a="tab">tab</button>
    <button class="sk acc" data-a="menu">menu</button>
    <button class="sk" data-a="catalog" aria-label="Catalog"><svg viewBox="0 0 24 24"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 1 5 16z"/><path d="M5 16a3.5 3.5 0 0 1 3.5-3.5H19"/></svg></button>
    <button class="sk" data-a="library" aria-label="Constants and formulas">const</button>
    <button class="sk" data-a="left" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <button class="sk" data-a="right" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
    <button class="sk" data-a="del" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg></button>
  </div>
  <section class="kp" id="kp" aria-label="Keypad">
    <div class="kpages" id="kpages"></div>
    <div class="kbar">
      <div class="kseg" id="kseg" role="tablist"></div>
      <button class="kk approx" data-a="approx" aria-label="Approximate">≈</button>
      <button class="kk enter" data-a="enter">enter</button>
    </div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><button class="ib back" id="sheet-back" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button><h2 id="sheet-title"></h2><button class="ib" id="sheet-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="file-open" hidden>
<input type="file" id="file-emu" hidden>

<script src="vendor/mathlive/mathlive.min.js"></script>
<script src="data/giacunits.js"></script>
<script src="js/tex2giac.js"></script>
<script src="js/giacfmt.js"></script>
<script src="js/cas.js"></script>
<script src="js/menus.js"></script>
<script src="js/keypad.js"></script>
<script src="data/constants.js"></script>
<script src="data/formulas.js"></script>
<script src="js/ui.js"></script>
<script src="js/calculator.js"></script>
<script src="js/graphs.js"></script>
<script src="js/lists.js"></script>
<script src="js/notes.js"></script>
<script src="js/programs.js"></script>
<script src="js/units.js"></script>
<script src="js/converter.js"></script>
<script src="js/plot.js"></script>
<script src="js/optics.js"></script>
<script src="js/guide.js"></script>
<script src="js/library.js"></script>
<script src="js/trig.js"></script>
<script src="js/ti36.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/main.js"></script>
</body>
</html>
